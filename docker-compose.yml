services:
  db:
    image: postgres:15-alpine
    container_name: agenda_postgres
    environment:
      POSTGRES_USER: agenda_user
      POSTGRES_PASSWORD: agenda_pass
      POSTGRES_DB: agenda_db
    ports:
      - "5433:5432"
    volumes:
      - agenda_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: agenda_backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: agenda_db
      DB_USER: agenda_user
      DB_PASSWORD: agenda_pass
      PYTHONUNBUFFERED: "1"
      FLASK_APP: app
      # Mail Configuration (Mailpit for local dev — override via .env for production)
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      MAIL_USE_TLS: "false"
      MAIL_DEFAULT_SENDER: "sistema@agenda.local"
      ADMIN_NOTIFICATION_EMAIL: "leonardo.bastidas@cauca.gov.co"
    command: [ "flask", "run", "--host=0.0.0.0" ]
    volumes:
      - ./backend:/app
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: agenda_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
    restart: unless-stopped

volumes:
  agenda_pgdata:
