server {
    listen 80;
    server_name localhost;

    location /filomena {
        return 301 $scheme://$http_host/filomena/;
    }

    # Frontend served under /filomena/
    location /filomena/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /filomena/index.html;
    }

    # Backend Proxy mapped to /filomena/api/
    location /filomena/api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vehiculos {
        return 301 $scheme://$http_host/vehiculos/;
    }

    # Proxy para Agenda de Vehículos (Frontend y API) con resolución dinámica para evitar caídas
    location /vehiculos/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_vehiculos http://vehiculos_nginx:80;
        rewrite ^/vehiculos/(.*)$ /$1 break;
        proxy_pass $upstream_vehiculos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
